name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Build projects explicitly: the .slnx carries no solution configs and the
      # WinAppSDK app must not be built platform-neutral.
      - name: Build extension (includes Core)
        run: dotnet build src/WebChat.CmdPal/WebChat.CmdPal.csproj -p:Platform=x64

      - name: Test
        run: dotnet test tests/Pomodoro.Tests/Pomodoro.Tests.csproj
